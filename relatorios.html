<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Agenda Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #F7F6F3;
    --surface:  #FFFFFF;
    --border:   #E5E3DC;
    --text-1:   #1A1916;
    --text-2:   #4A4840;
    --text-3:   #9A9890;
    --accent:   #6366F1;
    --accent-lt:#EEF2FF;
    --green:    #16A34A;
    --green-lt: #DCFCE7;
    --red:      #DC2626;
    --red-lt:   #FEE2E2;
    --amber:    #D97706;
    --amber-lt: #FEF3C7;
    --purple:   #7C3AED;
    --purple-lt:#EDE9FE;
    --font:     'DM Sans', sans-serif;
    --mono:     'DM Mono', monospace;
    --radius:   12px;
    --shadow:   0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #EEF2FF 0%, #F7F6F3 60%, #EDE9FE 100%);
  }
  .login-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(99,102,241,.12);
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .login-logo-icon {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
  }
  .login-logo h1 { font-size: 20px; font-weight: 700; }
  .login-logo span { font-size: 13px; color: var(--text-3); display: block; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 9px; font-family: var(--font); font-size: 14px;
    background: var(--bg); color: var(--text-1); outline: none;
    transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-group { margin-bottom: 16px; }
  .btn-login {
    width: 100%; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-family: var(--font); font-size: 15px;
    font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity .2s;
  }
  .btn-login:hover { opacity: .9; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; min-height: 20px; }

  /* ── APP ── */
  #app { display: none; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
  .topbar-title { font-size: 16px; font-weight: 700; }
  .topbar-sub { font-size: 12px; color: var(--text-3); margin-left: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .tenant-badge { font-size: 12px; color: var(--text-3); background: var(--bg); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }

  .main { padding: 32px; max-width: 1400px; margin: 0 auto; }

  /* ── FILTROS ── */
  .filters-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .filter-group select,
  .filter-group input {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-family: var(--font); font-size: 13px; background: var(--bg);
    color: var(--text-1); outline: none; min-width: 140px; cursor: pointer;
  }
  .filter-group select:focus,
  .filter-group input:focus { border-color: var(--accent); }
  .btn-filtrar {
    padding: 10px 20px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-family: var(--font);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: opacity .2s;
  }
  .btn-filtrar:hover { opacity: .9; }
  .btn-limpar {
    padding: 10px 16px; background: transparent; color: var(--text-3);
    border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font);
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; width: fit-content;
  }
  .tab {
    padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; background: transparent; color: var(--text-2);
    font-family: var(--font); transition: all .2s; white-space: nowrap;
  }
  .tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .tab:hover:not(.active) { background: var(--bg); color: var(--text-1); }

  /* ── CARDS KPI ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .kpi-value { font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
  .kpi-sub { font-size: 12px; color: var(--text-3); }
  .kpi-card.accent { border-left: 4px solid var(--accent); }
  .kpi-card.green  { border-left: 4px solid var(--green); }
  .kpi-card.amber  { border-left: 4px solid var(--amber); }
  .kpi-card.purple { border-left: 4px solid var(--purple); }

  /* ── GRID CHARTS ── */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 20px; color: var(--text-1); }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap.tall { height: 320px; }

  /* ── TABELA ── */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  .table-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-header h3 { font-size: 14px; font-weight: 600; }
  .table-count { font-size: 12px; color: var(--text-3); background: var(--bg); padding: 3px 10px; border-radius: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600;
    color: var(--text-3); text-transform: uppercase; letter-spacing: .05em;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green  { background: var(--green-lt);  color: var(--green); }
  .badge-red    { background: var(--red-lt);    color: var(--red); }
  .badge-amber  { background: var(--amber-lt);  color: var(--amber); }
  .badge-accent { background: var(--accent-lt); color: var(--accent); }
  .badge-purple { background: var(--purple-lt); color: var(--purple); }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 80px 20px; color: var(--text-3); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── OCUPAÇÃO ── */
  .ocupacao-bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .ocupacao-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s ease; }

  .logout-btn {
    padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 8px;
    background: transparent; font-family: var(--font); font-size: 12px;
    color: var(--text-3); cursor: pointer; transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .topbar { padding: 0 16px; }
    .filters-bar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">📊</div>
      <div>
        <h1>Relatórios</h1>
        <span>Agenda Pro · Artecon</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📊</div>
      <div>
        <span class="topbar-title">Relatórios</span>
        <span class="topbar-sub">Agenda Pro</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="tenant-badge" id="tenant-nome">—</span>
      <button class="logout-btn" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <div class="main">

    <!-- FILTROS -->
    <div class="filters-bar">
      <div class="filter-group">
        <label>Período</label>
        <select id="f-periodo" onchange="onPeriodoChange()">
          <option value="mes_atual">Mês atual</option>
          <option value="mes_anterior">Mês anterior</option>
          <option value="ultimos_30">Últimos 30 dias</option>
          <option value="ultimos_90">Últimos 90 dias</option>
          <option value="ano_atual">Ano atual</option>
          <option value="personalizado">Personalizado</option>
        </select>
      </div>
      <div class="filter-group" id="f-custom-wrap" style="display:none">
        <label>De</label>
        <input type="date" id="f-de">
      </div>
      <div class="filter-group" id="f-custom-wrap2" style="display:none">
        <label>Até</label>
        <input type="date" id="f-ate">
      </div>
      <div class="filter-group">
        <label>Profissional</label>
        <select id="f-usuario">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Serviço</label>
        <select id="f-servico">
          <option value="">Todos</option>
        </select>
      </div>
      <button class="btn-filtrar" onclick="aplicarFiltros()">🔍 Aplicar</button>
      <button class="btn-limpar" onclick="limparFiltros()">Limpar</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="irTab('agendamentos')">📅 Agendamentos</button>
      <button class="tab" onclick="irTab('clientes')">👥 Clientes</button>
      <button class="tab" onclick="irTab('ocupacao')">📈 Ocupação</button>
      <button class="tab" onclick="irTab('servicos')">🛠️ Serviços</button>
    </div>

    <div id="tab-content">
      <div class="loading"><div class="spinner"></div>Carregando dados...</div>
    </div>

  </div>
</div>

<script>
const SUPA_URL = 'https://vuwgxndahrzinfdlapxz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1d2d4bmRhaHJ6aW5mZGxhcHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NTA0ODgsImV4cCI6MjA5MDMyNjQ4OH0.9DaPGHIxt0CO-pjYPBwsHaoSqDN35CwVU0lJUyTXQIQ';

let TOKEN = '', TENANT_ID = '', TAB_ATUAL = 'agendamentos';
let AGENDAMENTOS = [], CLIENTES = [], SERVICOS = [], USUARIOS = [];
let _charts = {};

// ─── AUTH ────────────────────────────────────────────────────────────────────
async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha  = document.getElementById('login-senha').value;
  const btn    = document.getElementById('btn-login');
  const err    = document.getElementById('login-error');
  err.textContent = '';
  if (!email || !senha) { err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if (!data.access_token) { err.textContent = data.error_description || 'Credenciais inválidas.'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
    TOKEN = data.access_token;
    await inicializar();
  } catch(e) {
    err.textContent = 'Erro de conexão.'; btn.disabled = false; btn.textContent = 'Entrar';
  }
}
function fazerLogout() {
  TOKEN = ''; TENANT_ID = '';
  AGENDAMENTOS = []; CLIENTES = []; SERVICOS = []; USUARIOS = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-senha').value = '';
  document.getElementById('btn-login').disabled = false;
  document.getElementById('btn-login').textContent = 'Entrar';
}
document.getElementById('login-senha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

// ─── SUPABASE ────────────────────────────────────────────────────────────────
async function db(method, table, params = {}) {
  let url = `${SUPA_URL}/rest/v1/${table}`;
  if (Object.keys(params).length) {
    url += '?' + Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  }
  const res = await fetch(url, {
    method,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ─── INICIALIZAR ─────────────────────────────────────────────────────────────
async function inicializar() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tab-content').innerHTML = '<div class="loading"><div class="spinner"></div>Carregando dados...</div>';
  try {
    const usuarios = await db('GET', 'agenda_usuarios', { select: '*' });
    if (!usuarios.length) throw new Error('Usuário sem tenant.');
    TENANT_ID = usuarios[0].tenant_id;
    const tenant = await db('GET', 'agenda_tenants', { id: `eq.${TENANT_ID}`, select: 'nome_escritorio' });
    document.getElementById('tenant-nome').textContent = tenant[0]?.nome_escritorio || 'Escritório';
    await carregarDados();
    popularFiltros();
    irTab('agendamentos');
  } catch(e) {
    document.getElementById('tab-content').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Erro ao carregar</h3><p>${e.message}</p></div>`;
  }
}
async function carregarDados() {
  const [ags, cls, svs, usu] = await Promise.all([
    db('GET', 'agenda_agendamentos', { tenant_id: `eq.${TENANT_ID}`, select: '*', order: 'data_inicio.desc', limit: 2000 }),
    db('GET', 'agenda_clientes',     { tenant_id: `eq.${TENANT_ID}`, select: '*' }),
    db('GET', 'agenda_servicos',     { tenant_id: `eq.${TENANT_ID}`, select: '*' }),
    db('GET', 'agenda_usuarios',     { tenant_id: `eq.${TENANT_ID}`, select: '*' }),
  ]);
  AGENDAMENTOS = ags; CLIENTES = cls; SERVICOS = svs; USUARIOS = usu;
}

// ─── FILTROS ─────────────────────────────────────────────────────────────────
function popularFiltros() {
  const su = document.getElementById('f-usuario');
  USUARIOS.forEach(u => { const o = document.createElement('option'); o.value = u.id; o.textContent = u.nome; su.appendChild(o); });
  const ss = document.getElementById('f-servico');
  SERVICOS.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.nome; ss.appendChild(o); });
}
function onPeriodoChange() {
  const p = document.getElementById('f-periodo').value;
  const custom = p === 'personalizado';
  document.getElementById('f-custom-wrap').style.display  = custom ? '' : 'none';
  document.getElementById('f-custom-wrap2').style.display = custom ? '' : 'none';
}
function getPeriodo() {
  const p = document.getElementById('f-periodo').value;
  const hoje = new Date();
  let de, ate;
  if (p === 'mes_atual') {
    de  = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    ate = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  } else if (p === 'mes_anterior') {
    de  = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
    ate = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
  } else if (p === 'ultimos_30') {
    de  = new Date(hoje - 30*86400000);
    ate = hoje;
  } else if (p === 'ultimos_90') {
    de  = new Date(hoje - 90*86400000);
    ate = hoje;
  } else if (p === 'ano_atual') {
    de  = new Date(hoje.getFullYear(), 0, 1);
    ate = new Date(hoje.getFullYear(), 11, 31);
  } else {
    de  = new Date(document.getElementById('f-de').value  + 'T00:00:00');
    ate = new Date(document.getElementById('f-ate').value + 'T23:59:59');
  }
  return { de, ate };
}
function filtrarAgs() {
  const { de, ate } = getPeriodo();
  const uId = document.getElementById('f-usuario').value;
  const sId = document.getElementById('f-servico').value;
  return AGENDAMENTOS.filter(a => {
    const dt = new Date(a.data_inicio);
    if (dt < de || dt > ate) return false;
    if (uId && a.usuario_responsavel_id !== uId) return false;
    if (sId && a.servico_id !== sId) return false;
    return true;
  });
}
function aplicarFiltros() { irTab(TAB_ATUAL); }
function limparFiltros() {
  document.getElementById('f-periodo').value  = 'mes_atual';
  document.getElementById('f-usuario').value  = '';
  document.getElementById('f-servico').value  = '';
  onPeriodoChange();
  irTab(TAB_ATUAL);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmtDate = d => new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
const getNome  = (arr, id, field='nome') => (arr.find(x=>x.id===id)||{})[field] || '—';
const STATUS_LABEL = { confirmado:'Confirmado', concluido:'Concluído', solicitado:'Solicitado', pendente_confirmacao:'Pendente', cancelado_cliente:'Cancelado', cancelado_escritorio:'Cancelado', nao_compareceu:'Não compareceu' };
const STATUS_BADGE = { concluido:'badge-green', cancelado_cliente:'badge-red', cancelado_escritorio:'badge-red', nao_compareceu:'badge-red', confirmado:'badge-accent', solicitado:'badge-amber', pendente_confirmacao:'badge-amber' };
function destroyChart(id) { if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; } }
function pct(v, t) { return t ? Math.round(v/t*100) : 0; }
function cor(i) {
  const cores = ['#6366F1','#16A34A','#D97706','#7C3AED','#DC2626','#0EA5E9','#F59E0B','#10B981','#8B5CF6','#EF4444'];
  return cores[i % cores.length];
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function irTab(tab) {
  TAB_ATUAL = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => { if (t.textContent.toLowerCase().includes(tab.slice(0,4))) t.classList.add('active'); });
  const ags = filtrarAgs();
  const { de, ate } = getPeriodo();
  const periodoStr = `${fmtDate(de)} a ${fmtDate(ate)}`;
  Object.keys(_charts).forEach(k => destroyChart(k));
  if (tab === 'agendamentos') renderAgendamentos(ags, periodoStr);
  else if (tab === 'clientes')  renderClientes(ags, periodoStr);
  else if (tab === 'ocupacao')  renderOcupacao(ags, periodoStr);
  else if (tab === 'servicos')  renderServicos(ags, periodoStr);
}

// ─── TAB: AGENDAMENTOS ───────────────────────────────────────────────────────
function renderAgendamentos(ags, periodo) {
  const total     = ags.length;
  const concluidos= ags.filter(a=>a.status==='concluido').length;
  const cancelados= ags.filter(a=>['cancelado_cliente','cancelado_escritorio'].includes(a.status)).length;
  const noshow    = ags.filter(a=>a.status==='nao_compareceu').length;
  const taxaConc  = pct(concluidos, total);

  // Agrupar por dia
  const porDia = {};
  ags.forEach(a => {
    const dia = a.data_inicio.slice(0,10);
    if (!porDia[dia]) porDia[dia] = { total:0, concluidos:0 };
    porDia[dia].total++;
    if (a.status === 'concluido') porDia[dia].concluidos++;
  });
  const dias = Object.keys(porDia).sort();
  const labDias = dias.map(d => new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));

  // Distribuição por status
  const statusCnt = {};
  ags.forEach(a => { statusCnt[a.status] = (statusCnt[a.status]||0)+1; });

  document.getElementById('tab-content').innerHTML = `
  <div class="kpi-grid">
    <div class="kpi-card accent"><div class="kpi-label">Total de Agendamentos</div><div class="kpi-value">${total}</div><div class="kpi-sub">${periodo}</div></div>
    <div class="kpi-card green"><div class="kpi-label">Concluídos</div><div class="kpi-value" style="color:var(--green)">${concluidos}</div><div class="kpi-sub">${taxaConc}% do total</div></div>
    <div class="kpi-card amber"><div class="kpi-label">Cancelados</div><div class="kpi-value" style="color:var(--amber)">${cancelados}</div><div class="kpi-sub">${pct(cancelados,total)}% do total</div></div>
    <div class="kpi-card purple"><div class="kpi-label">Não Compareceu</div><div class="kpi-value" style="color:var(--purple)">${noshow}</div><div class="kpi-sub">${pct(noshow,total)}% do total</div></div>
  </div>
  <div class="charts-grid">
    <div class="chart-card full"><div class="chart-title">📅 Agendamentos por Dia</div><div class="chart-wrap tall"><canvas id="chart-dias"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🥧 Distribuição por Status</div><div class="chart-wrap"><canvas id="chart-status"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">📆 Agendamentos por Dia da Semana</div><div class="chart-wrap"><canvas id="chart-semana"></canvas></div></div>
  </div>
  <div class="table-card">
    <div class="table-header"><h3>Lista de Agendamentos</h3><span class="table-count">${total} registros</span></div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Status</th></tr></thead>
      <tbody>
      ${ags.length === 0 ? `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📭</div><h3>Sem agendamentos no período</h3></div></td></tr>` :
        ags.map(a => `<tr>
          <td style="font-family:var(--mono);font-size:12px">${fmtDate(a.data_inicio)}</td>
          <td style="font-family:var(--mono);font-size:12px">${fmtTime(a.data_inicio)}</td>
          <td style="font-weight:500">${getNome(CLIENTES,a.cliente_id)}</td>
          <td>${getNome(SERVICOS,a.servico_id)}</td>
          <td>${getNome(USUARIOS,a.usuario_responsavel_id)}</td>
          <td><span class="badge ${STATUS_BADGE[a.status]||'badge-accent'}">${STATUS_LABEL[a.status]||a.status}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>`;

  // Chart: por dia
  _charts['dias'] = new Chart(document.getElementById('chart-dias'), {
    type: 'bar',
    data: {
      labels: labDias,
      datasets: [
        { label: 'Total', data: dias.map(d=>porDia[d].total), backgroundColor: '#6366F133', borderColor: '#6366F1', borderWidth: 2, borderRadius: 4 },
        { label: 'Concluídos', data: dias.map(d=>porDia[d].concluidos), backgroundColor: '#16A34A33', borderColor: '#16A34A', borderWidth: 2, borderRadius: 4 },
      ]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });

  // Chart: status
  const stKeys = Object.keys(statusCnt);
  _charts['status'] = new Chart(document.getElementById('chart-status'), {
    type: 'doughnut',
    data: {
      labels: stKeys.map(s=>STATUS_LABEL[s]||s),
      datasets: [{ data: stKeys.map(s=>statusCnt[s]), backgroundColor: stKeys.map((_,i)=>cor(i)), borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right' } } }
  });

  // Chart: dia da semana
  const semana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const porSemana = [0,0,0,0,0,0,0];
  ags.forEach(a => { porSemana[new Date(a.data_inicio).getDay()]++; });
  _charts['semana'] = new Chart(document.getElementById('chart-semana'), {
    type: 'bar',
    data: {
      labels: semana,
      datasets: [{ label: 'Agendamentos', data: porSemana, backgroundColor: porSemana.map((_,i)=>cor(i)), borderRadius: 6 }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });
}

// ─── TAB: CLIENTES ───────────────────────────────────────────────────────────
function renderClientes(ags, periodo) {
  const clientesAtivos = new Set(ags.map(a=>a.cliente_id));
  const totalClientes  = CLIENTES.length;
  const ativosNoPeriodo= clientesAtivos.size;

  // Ranking clientes
  const cntCliente = {};
  ags.forEach(a => { cntCliente[a.cliente_id] = (cntCliente[a.cliente_id]||0)+1; });
  const ranking = Object.entries(cntCliente).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Novos clientes por mês (aproximado por data do primeiro agendamento)
  const primeiroAg = {};
  [...ags].reverse().forEach(a => { primeiroAg[a.cliente_id] = a.data_inicio.slice(0,7); });
  const novosPorMes = {};
  Object.values(primeiroAg).forEach(m => { novosPorMes[m] = (novosPorMes[m]||0)+1; });

  <div class="kpi-grid">

    <div class="kpi-card green"><div class="kpi-label">Clientes Atendidos</div><div class="kpi-value" style="color:var(--green)">${ativosNoPeriodo}</div><div class="kpi-sub">${periodo}</div></div>
    <div class="kpi-card amber"><div class="kpi-label">Média por Cliente</div><div class="kpi-value" style="color:var(--amber)">${ativosNoPeriodo ? (ags.length/ativosNoPeriodo).toFixed(1) : '0'}</div><div class="kpi-sub">agendamentos/cliente</div></div>
    <div class="kpi-card purple"><div class="kpi-label">Clientes Inativos</div><div class="kpi-value" style="color:var(--purple)">${totalClientes - ativosNoPeriodo}</div><div class="kpi-sub">sem agendamento no período</div></div>

  <div class="charts-grid">
    <div class="chart-card"><div class="chart-title">🏆 Top 10 Clientes por Agendamentos</div><div class="chart-wrap tall"><canvas id="chart-top-clientes"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">📈 Novos Clientes por Mês</div><div class="chart-wrap tall"><canvas id="chart-novos"></canvas></div></div>

  <div class="table-card">
    <div class="table-header"><h3>Ranking de Clientes</h3><span class="table-count">${ativosNoPeriodo} ativos no período</span></div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>#</th><th>Cliente</th><th>Agendamentos</th><th>Concluídos</th><th>Cancelados</th><th>Última visita</th></tr></thead>
      <tbody>
      ${ranking.length === 0 ? `<tr><td colspan="6"><div class="empty"><div class="empty-icon">👥</div><h3>Sem dados no período</h3></div></td></tr>` :
        ranking.map(([cId, cnt], i) => {
          const agsCli = ags.filter(a=>a.cliente_id===cId);
          const conc   = agsCli.filter(a=>a.status==='concluido').length;
          const canc   = agsCli.filter(a=>['cancelado_cliente','cancelado_escritorio'].includes(a.status)).length;
          const ultima = agsCli.sort((a,b)=>b.data_inicio.localeCompare(a.data_inicio))[0];
          return `<tr>
            <td style="font-weight:700;color:var(--accent)">${i+1}</td>

// ─── TAB: OCUPAÇÃO ───────────────────────────────────────────────────────────
function renderOcupacao(ags, periodo) {
  // Horas disponíveis por profissional (estimativa: 8h/dia úteis no período)
  const { de, ate } = getPeriodo();
  let diasUteis = 0;
  for (let d = new Date(de); d <= ate; d.setDate(d.getDate()+1)) {
    const dow = d.getDay();
    if (dow > 0 && dow < 6) diasUteis++;
  }
  const horasDisp = diasUteis * 8;

  const porUsuario = {};
  USUARIOS.forEach(u => { porUsuario[u.id] = { nome: u.nome, ags:[], minutos:0 }; });
  ags.forEach(a => {
    if (!porUsuario[a.usuario_responsavel_id]) return;
    porUsuario[a.usuario_responsavel_id].ags.push(a);
    if (a.data_inicio && a.data_fim) {
      const min = (new Date(a.data_fim) - new Date(a.data_inicio)) / 60000;
      if (min > 0 && min < 600) porUsuario[a.usuario_responsavel_id].minutos += min;
    }
  });

  const rows = Object.entries(porUsuario).map(([id, u]) => {
    const horas = (u.minutos / 60).toFixed(1);
    const taxa  = horasDisp > 0 ? Math.min(100, Math.round((u.minutos/60)/horasDisp*100)) : 0;
    return { id, ...u, horas, taxa };
  }).sort((a,b)=>b.taxa-a.taxa);

  // Heatmap: hora x dia da semana
  const heatmap = {};
  for (let h=7; h<=19; h++) for (let d=0; d<7; d++) heatmap[`${h}_${d}`]=0;
  ags.forEach(a => {
    const dt = new Date(a.data_inicio);
    const h = dt.getHours(), d = dt.getDay();
    if (h>=7 && h<=19) heatmap[`${h}_${d}`]++;
  });
  const maxH = Math.max(...Object.values(heatmap), 1);

  document.getElementById('tab-content').innerHTML = `
  <div class="kpi-grid">
    <div class="kpi-card accent"><div class="kpi-label">Dias Úteis no Período</div><div class="kpi-value">${diasUteis}</div><div class="kpi-sub">${periodo}</div></div>
    <div class="kpi-card green"><div class="kpi-label">Profissionais Ativos</div><div class="kpi-value" style="color:var(--green)">${rows.filter(r=>r.ags.length>0).length}</div><div class="kpi-sub">com agendamentos</div></div>
    <div class="kpi-card amber"><div class="kpi-label">Total de Horas</div><div class="kpi-value" style="color:var(--amber)">${(ags.reduce((s,a)=>{if(a.data_inicio&&a.data_fim){const m=(new Date(a.data_fim)-new Date(a.data_inicio))/60000;return s+(m>0&&m<600?m:0);}return s;},0)/60).toFixed(0)}h</div><div class="kpi-sub">atendimento no período</div></div>
    <div class="kpi-card purple"><div class="kpi-label">Média de Ocupação</div><div class="kpi-value" style="color:var(--purple)">${rows.length ? Math.round(rows.reduce((s,r)=>s+r.taxa,0)/rows.length) : 0}%</div><div class="kpi-sub">todos os profissionais</div></div>
  </div>
  <div class="charts-grid">
    <div class="chart-card"><div class="chart-title">👤 Taxa de Ocupação por Profissional</div><div class="chart-wrap tall"><canvas id="chart-ocup"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">🕐 Horários Mais Movimentados</div>
      <div style="overflow-x:auto;padding-top:8px">
        <table style="font-size:11px;width:auto">
          <thead><tr><th style="min-width:36px">Hora</th>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<th style="min-width:36px;text-align:center">${d}</th>`).join('')}</tr></thead>
          <tbody>${Array.from({length:13},(_,i)=>i+7).map(h=>`<tr><td style="font-family:var(--mono);font-size:11px;font-weight:600">${String(h).padStart(2,'0')}h</td>${[0,1,2,3,4,5,6].map(d=>{const v=heatmap[`${h}_${d}`];const op=(v/maxH).toFixed(2);return`<td style="text-align:center;background:rgba(99,102,241,${op});color:${v>0?'#fff':'var(--text-3)'};border-radius:4px;padding:5px 8px;font-weight:${v>0?'600':'400'}">${v||''}</td>`;}).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="table-card">
    <div class="table-header"><h3>Detalhamento por Profissional</h3><span class="table-count">${rows.length} profissionais</span></div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>Profissional</th><th>Agendamentos</th><th>Horas</th><th>Taxa de Ocupação</th><th>Concluídos</th><th>No-show</th></tr></thead>
      <tbody>
      ${rows.map(r => `<tr>
        <td style="font-weight:600">${r.nome}</td>
        <td>${r.ags.length}</td>
        <td style="font-family:var(--mono)">${r.horas}h</td>
        <td style="min-width:160px">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="ocupacao-bar" style="flex:1"><div class="ocupacao-fill" style="width:${r.taxa}%"></div></div>
            <span style="font-weight:600;font-size:13px;min-width:36px">${r.taxa}%</span>
          </div>
        </td>
        <td><span class="badge badge-green">${r.ags.filter(a=>a.status==='concluido').length}</span></td>
        <td><span class="badge badge-red">${r.ags.filter(a=>a.status==='nao_compareceu').length}</span></td>
      </tr>`).join('')}
      </tbody>
    </table>
    </div>
  </div>`;

  _charts['ocup'] = new Chart(document.getElementById('chart-ocup'), {
    type: 'bar',
    data: {
      labels: rows.map(r=>r.nome.split(' ')[0]),
      datasets: [{ label: 'Ocupação (%)', data: rows.map(r=>r.taxa), backgroundColor: rows.map((_,i)=>cor(i)), borderRadius:6 }]
    },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, max:100, ticks:{ callback: v=>v+'%' } } } }
  });
}

// ─── TAB: SERVIÇOS ───────────────────────────────────────────────────────────
function renderServicos(ags, periodo) {
  const cntServ = {};
  const recServ = {};
  ags.forEach(a => {
    cntServ[a.servico_id] = (cntServ[a.servico_id]||0)+1;
    if (!recServ[a.servico_id] || a.data_inicio > recServ[a.servico_id]) recServ[a.servico_id] = a.data_inicio;
  });
  const ranking = Object.entries(cntServ).sort((a,b)=>b[1]-a[1]);
  const total   = ags.length;
  const top     = ranking[0];

  // Por mês
  const porMes = {};
  ags.forEach(a => {
    const m = a.data_inicio.slice(0,7);
    const s = getNome(SERVICOS,a.servico_id);
    if (!porMes[m]) porMes[m] = {};
    porMes[m][s] = (porMes[m][s]||0)+1;

  const meses = Object.keys(porMes).sort();
  const topServicos = ranking.slice(0,5).map(([id])=>getNome(SERVICOS,id));

  document.getElementById('tab-content').innerHTML = `
  <div class="kpi-grid">

      datasets: [{ label: 'Agendamentos', data: ranking.map(([,v])=>v), backgroundColor: ranking.map((_,i)=>cor(i)), borderRadius:6 }]
    },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true } } }
  });

  _charts['pie-serv'] = new Chart(document.getElementById('chart-pie-serv'), {
    type: 'doughnut',
    data: {
      labels: ranking.map(([id])=>getNome(SERVICOS,id)),
      datasets: [{ data: ranking.map(([,v])=>v), backgroundColor: ranking.map((_,i)=>cor(i)), borderWidth:2, borderColor:'#fff' }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ font:{ size:11 } } } } }
  });

  _charts['evolucao'] = new Chart(document.getElementById('chart-evolucao'), {
    type: 'line',
    data: {
      labels: meses.map(m => { const [y,mo]=m.split('-'); return `${mo}/${y.slice(2)}`; }),
      datasets: topServicos.map((sv,i) => ({
        label: sv,
        data: meses.map(m => (porMes[m]||{})[sv]||0),
        borderColor: cor(i), backgroundColor: cor(i)+'22', fill:false, tension:.4, pointRadius:3
      }))
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });
}
</script>
</body>
</html>
